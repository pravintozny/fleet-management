<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fleet Expenses</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:.4rem;text-align:left}
.err{color:#b00020}button{cursor:pointer}
</style></head><body>
<h1>Fleet Expenses</h1>
<form id="f">
 <input name="vehicleId" placeholder="Vehicle ID" required>
 <select name="category" id="cat"></select>
 <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
 <input name="date" type="date" required>
 <input name="vendor" placeholder="Vendor">
 <input name="description" placeholder="Description">
 <button>Add expense</button>
</form>
<p class="err" id="err"></p>
<label>Status filter <select id="sf"><option value="">all</option></select></label>
<h2>Summary</h2><pre id="sum"></pre>
<table><thead><tr><th>Date</th><th>Vehicle</th><th>Category</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NEXT={draft:['submit'],submitted:['approve','reject'],approved:['reimburse'],rejected:['reopen'],reimbursed:[]};
async function api(path,opts){const r=await fetch(path,opts);const b=r.status===204?null:await r.json();if(!r.ok)throw new Error(b.details?JSON.stringify(b.details):b.error);return b}
async function load(){
 const s=$('sf').value;
 const list=await api('/api/expenses'+(s?'?status='+s:''));
 $('sum').textContent=JSON.stringify(await api('/api/expenses/summary'),null,2);
 $('rows').innerHTML=list.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.vehicleId)}</td><td>${esc(e.category)}</td><td>${e.amount.toFixed(2)} ${esc(e.currency)}</td><td>${esc(e.status)}</td><td>${NEXT[e.status].map(a=>`<button data-id="${e.id}" data-a="${a}">${a}</button>`).join(' ')}${e.status==='draft'?` <button data-id="${e.id}" data-a="delete">delete</button>`:''}</td></tr>`).join('');
}
$('rows').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;$('err').textContent='';
 try{
  if(b.dataset.a==='delete')await api('/api/expenses/'+b.dataset.id,{method:'DELETE'});
  else{let note;if(b.dataset.a==='reject'){note=prompt('Reason for rejection?');if(!note)return}
   await api(`/api/expenses/${b.dataset.id}/${b.dataset.a}`,{method:'POST',body:JSON.stringify({note})})}
  load()}catch(e){$('err').textContent=e.message}};
$('f').onsubmit=async ev=>{ev.preventDefault();$('err').textContent='';const d=Object.fromEntries(new FormData(ev.target));d.amount=Number(d.amount);
 try{await api('/api/expenses',{method:'POST',body:JSON.stringify(d)});ev.target.reset();load()}catch(e){$('err').textContent=e.message}};
$('sf').onchange=load;
api('/api/expense-meta').then(m=>{$('cat').innerHTML=m.categories.map(c=>`<option>${c}</option>`).join('');$('sf').innerHTML+=m.statuses.map(c=>`<option>${c}</option>`).join('')}).then(load);
</script></body></html>
