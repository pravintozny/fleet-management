<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fleet – Maintenance</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;margin:2rem;max-width:1100px}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;padding:.4rem;text-align:left}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem;margin:1rem 0}
label{display:flex;flex-direction:column;font-size:.85rem}
.err{color:#b00020}.overdue{background:#fff1f0}.cards span{margin-right:1.5rem}
</style></head><body>
<h1>Maintenance Management</h1>
<div class="cards" id="summary"></div>
<form id="form">
 <label>Vehicle ID<input name="vehicleId" required></label>
 <label>Type<select name="type" id="type"></select></label>
 <label>Description<input name="description" required></label>
 <label>Scheduled date<input type="date" name="scheduledDate" required></label>
 <label>Cost<input type="number" step="0.01" min="0" name="cost"></label>
 <label>Odometer<input type="number" min="0" name="odometer"></label>
 <label>Next service odometer<input type="number" min="0" name="nextServiceOdometer"></label>
 <label>Next service date<input type="date" name="nextServiceDate"></label>
 <label>Vendor<input name="vendor"></label>
 <label>&nbsp;<button>Schedule</button></label>
</form>
<p class="err" id="error"></p>
<label>Filter status <select id="filter"><option value="">All</option></select></label>
<table><thead><tr><th>ID</th><th>Vehicle</th><th>Type</th><th>Description</th><th>Date</th><th>Status</th><th>Cost</th><th></th></tr></thead>
<tbody id="rows"></tbody></table>
<script src="app.js"></script></body></html>
